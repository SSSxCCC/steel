[workspace]
resolver = "2"
members = [
    # All of Steel's official crates are within the `crates` folder!
    "crates/*",
    "examples/empty-project",
    "examples/demo",
    "examples/ball",
]

[package]
name = "steel-engine"
version = "0.3.0"
edition = "2021"
description = "The steel game engine library."
license = "MIT"
repository = "https://github.com/SSSxCCC/steel"
documentation = "https://docs.rs/steel-engine"

[lib]
name = "steel"

[dependencies]
steel-internal = { version = "0.3.0", path = "crates/steel-internal" }

[features]
default = []
editor = ["steel-internal/editor"]

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"
