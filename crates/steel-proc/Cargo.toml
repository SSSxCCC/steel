[package]
name = "steel-proc"
version = "0.3.0"
edition = "2021"
description = "The steel game engine proc-macro library."
license = "MIT"
repository = "https://github.com/SSSxCCC/steel"
documentation = "https://docs.rs/steel-proc"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
