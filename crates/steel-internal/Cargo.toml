[package]
name = "steel-internal"
version = "0.3.0"
edition = "2021"
description = "The steel game engine core library."
license = "MIT"
repository = "https://github.com/SSSxCCC/steel"
documentation = "https://docs.rs/steel-internal"

[lib]
doctest = false

[dependencies]
steel-common = { version = "0.3.0", path = "../steel-common" }
steel-client = { version = "0.3.0", path = "../steel-client" }
steel-proc = { version = "0.3.0", path = "../steel-proc" }
image = "0.25"
obj-rs = "0.7"
rand = "0.8"
bytemuck = "1.14"

vulkano = { package = "steel-vulkano", version = "0.35.2", path = "../../dependencies/vulkano" }
vulkano-util = { package = "steel-vulkano-util", version = "0.35.0", path = "../../dependencies/vulkano-util" }
vulkano-shaders = "0.35"
egui = "0.31"
log = "0.4"
shipyard = { version = "0.7", features = [ "serde1" ] }
rayon = "1.8"
parry2d = "0.17"
parry3d = "0.17"
rapier2d = { version = "0.22", features = [ "debug-render" ] }
rapier3d = { version = "0.22", features = [ "debug-render" ] }
nalgebra = { version = "0.33", features = [ "convert-glam024" ] }
glam = { version = "0.24", features = [ "serde" ] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
indexmap = { version = "2.2", features = [ "serde" ] }

[target.'cfg(not(target_os = "android"))'.dependencies]
steel-editor = { version = "0.3.0", path = "../steel-editor", optional = true }

[features]
default = []
editor = ["steel-editor"]
